<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f4f7fc">
  <title>Google Homeを開く</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:#f4f7fc;color:#202124;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.8}main{width:100%;max-width:440px;padding:36px 24px;background:#fff;border-radius:24px;box-shadow:0 10px 40px #2030500c}h1{font-size:25px;line-height:1.4;margin:0 0 20px}.button{display:block;text-align:center;background:#1967d2;color:white;text-decoration:none;padding:15px 12px;border-radius:12px;font-weight:700;margin:24px 0}p{font-size:15px}.hint{font-size:13px;color:#5f6368}details{margin-top:24px}summary{cursor:pointer}a{color:#1967d2}
  </style>
</head>
<body>
  <main>
    <h1>Google Homeを開く</h1>
    <p>下のボタンを押してください。</p>
    <a class="button" id="open" href="https://home.google.com/home-app/">Google Homeを開く</a>
    <p class="hint">確認が表示された場合は「開く」を選んでください。</p>
    <details>
      <summary>開かない場合</summary>
      <p>Google Homeがインストールされていることをご確認ください。</p>
      <p>LINE内で開かない場合は、メニューからChromeやSafariでこのページを開き、もう一度ボタンを押してください。</p>
    </details>
    <p class="hint">更新版 v4</p>
  </main>
  <script>
    const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    if (isIOS) {
      const button = document.getElementById('open');
      button.href = 'googlehome://';
      button.textContent = 'Google Homeを開く（iPhone用）';
      document.querySelector('main > p').textContent = 'iPhone向け起動リンクのテストです。下のボタンを押してください。';
    }
  </script>
</body>
</html>
